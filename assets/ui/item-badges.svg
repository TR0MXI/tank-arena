<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="192" height="192" viewBox="0 0 96 96">
  <!-- 32-unit cells, in Item::ALL order. The clear gutter keeps the corners transparent. -->
  <defs>
    <g id="plate">
      <rect x="1.5" y="1.5" width="29" height="29" rx="7" stroke="#213533" stroke-width="2"/>
      <rect x="3" y="3" width="26" height="26" rx="5.5" fill="none" stroke="#fff" stroke-opacity=".40"/>
    </g>
  </defs>
  <g id="laser" fill="#b3344d">
    <use xlink:href="#plate"/>
    <path d="m7 23 7-14 2 12 8-13" fill="none" stroke="white" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g id="double" transform="translate(32 0)" fill="#386099">
    <use xlink:href="#plate"/>
    <g transform="rotate(32 16 16)" fill="white">
      <rect x="9" y="6.5" width="5" height="16" rx="1"/>
      <rect x="18" y="6.5" width="5" height="16" rx="1"/>
      <rect x="9" y="20" width="14" height="5" rx="1.5"/>
    </g>
  </g>
  <g id="shotgun" transform="translate(64 0)" fill="#95562f">
    <use xlink:href="#plate"/>
    <path d="m8 24 5-5m-3-3 2-7m4 9 5-6m-3 10 6-2" fill="none" stroke="white" stroke-width="3.2" stroke-linecap="round"/>
  </g>
  <g id="missile" transform="translate(0 32)" fill="#734199">
    <use xlink:href="#plate"/>
    <path fill="white" d="M25 6c-6 0-10 3-13 8l-5 1-2 4 7 1 1 7 4-2 1-5c5-3 8-8 7-14Z"/>
    <circle cx="20" cy="11.5" r="2"/>
    <path d="m10 22-3 3" stroke="white" stroke-width="2.7" stroke-linecap="round"/>
  </g>
  <g id="mine" transform="translate(32 32)" fill="#845920">
    <use xlink:href="#plate"/>
    <path d="M16 8v4M7.5 11.5l3 3m14-3-3 3" fill="none" stroke="white" stroke-width="3" stroke-linecap="round"/>
    <path d="M7 20a9 8 0 0 1 18 0ZM6 22h20v3H6z" fill="white"/>
  </g>
  <g id="gatling" transform="translate(64 32)" fill="#7d435d">
    <use xlink:href="#plate"/>
    <circle cx="16" cy="16" r="10" fill="white"/>
    <circle cx="16" cy="11.5" r="2.8"/><circle cx="12" cy="18.5" r="2.8"/><circle cx="20" cy="18.5" r="2.8"/>
  </g>
  <g id="frag" transform="translate(0 64)" fill="#bd4a22">
    <use xlink:href="#plate"/>
    <g transform="rotate(30 16 16)">
      <circle cx="18" cy="7" r="2.8" fill="none" stroke="white" stroke-width="2.3"/>
      <rect x="12" y="8.5" width="7" height="5" rx="1" fill="white"/>
      <rect x="8.5" y="12" width="15" height="15" rx="6" fill="white"/>
      <path d="M15 12v15m-7-8h16" fill="none" stroke="#bd4a22" stroke-width="1.8"/>
    </g>
  </g>
  <g id="shield" transform="translate(32 64)" fill="#217ca0">
    <use xlink:href="#plate"/>
    <path fill="white" fill-rule="evenodd" d="m16 5 9 4v6c0 6-5 10-9 12-4-2-9-6-9-12V9Zm0 4v14c3-2 6-5 6-9v-3Z"/>
  </g>
  <g id="speed" transform="translate(64 64)" fill="#27834c">
    <use xlink:href="#plate"/>
    <path fill="white" d="m6 8 7 8-7 8h6l7-8-7-8zm10 0 7 8-7 8h5l7-8-7-8z"/>
  </g>
</svg>
