  <path d="M-4.8-3.5l2.7-1.9h4.4" stroke="#fff" stroke-width="1.3" fill="none"/>
  <rect x="-1.7" y="-2.8" width="5.6" height="5.6" rx="2.2" fill-opacity=".76"/>
  <path d="M11-10l3 2h-3zm0 20l3-2h-3z" fill="#fff"/>
</g>
